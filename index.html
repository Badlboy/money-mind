<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Mind</title>
<meta name="description" content="Демо-прототип Money Mind: особисті фінанси, FREE і Premium.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FCF7F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money Mind">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0}body{-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* Палітра Money Mind — піпеткою з макета власника (ADR-0008).
     Сторінка однотемна навмисно: телефон за рішенням власника світлий. */
  :root {
    --page:#FCF7F0; --card:#F6EEE4; --white:#FFFFFF; --line:#EDE5DC;
    --ink:#181818; --ink2:#6B625A; --ink3:#9A9088;
    --teal:#2D5C63; --teal2:#457277; --pos:#3B8C64; --neg:#CA5962;
    --gold:#C3A98F; --gold2:#D4BCA0; --prem:#0E0A06;
    --on-bg:#181818; --on-fg:#FCF7F0;
    --nw-grad:linear-gradient(135deg,#2D5C63,#457277); --nw-sub:#CFE0E0;
    --ava:linear-gradient(135deg,#D8C0A8,#A58A6A);
    --row-now:#F4EEE5; --bar:#D9C8B4; --msg-me:#E3EAF3; --grab:#D8CEC3;
    --acc-bg:#E6F0F0; --lock-bg:#F4E9DC; --lock-fg:#8A6A4A;
    --neg-bg:#FBEDEB; --pos-bg:#E4F1EA;
    --sav-bg:#EAF1F5; --sav-bd:#DCE8EE; --sav-fg:#3D6D8F;
    --veil:rgba(252,247,240,.92); --veil0:rgba(252,247,240,.2);
    --ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"Cormorant Garamond","Times New Roman",Georgia,serif;
    --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#EFE7DD;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{transition:background-color .6s}
  html.is-prem body{background:#141216}
  .page{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px}
  .page>div{width:100%;display:flex;justify-content:center}

  /* ── панель поруч ── */
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:20px}
  @media (max-width:900px){.side{position:static}}
  .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:0}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,4.6vw,50px);line-height:1.02;margin:6px 0 10px;text-wrap:balance}
  .lead{font-size:16px;color:var(--ink2);line-height:1.55;margin:0;max-width:60ch}
  .box{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
  .box h2{font-size:14px;font-weight:800;margin:0 0 10px;letter-spacing:.01em}
  .box p,.box li{font-size:13.5px;line-height:1.55;color:var(--ink2)}
  .box ul{margin:0;padding-left:1.1em}.box li{margin-bottom:5px}
  .box b{color:var(--ink)}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border-radius:999px;padding:4px}
  .modes button{font:inherit;font-size:13.5px;font-weight:800;border:0;border-radius:999px;padding:10px;cursor:pointer;background:transparent;color:var(--ink2)}
  .modes button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
  .modes button.pm[aria-pressed="true"]{background:#0B0B0D;color:#D6B878}
  .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .ctl button{font:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--page);color:var(--ink2);border-radius:999px;padding:7px 12px;cursor:pointer}
  .ctl button:hover{background:var(--card);color:var(--ink)}
  .tries{display:grid;gap:8px;margin:0;padding:0;list-style:none}
  .tries li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:13.5px;color:var(--ink2)}
  .tries .n{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .t-real{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--teal);color:#fff}
  .t-fake{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#F3E3E1;color:var(--neg)}
  button:focus-visible,[data-go]:focus-visible,[data-act]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* ══════ ТЕЛЕФОН · iPhone Air 420×912 ══════ */
  .po{container-type:inline-size;width:100%;max-width:min(440px,calc((100vh - 48px) / 2.104));max-width:min(440px,calc((100dvh - 48px) / 2.104));margin-inline:auto}
  .ph{background:#1E1B18;border-radius:calc(100cqw*68/444);padding:calc(100cqw*11/444);box-shadow:0 0 0 calc(100cqw*2/444) #3A342E,0 18px 40px -18px rgba(40,28,16,.35)}
  .sc{position:relative;background:var(--page);transition:background-color .5s;border-radius:calc(100cqw*57/444);overflow:hidden;aspect-ratio:420/912;display:flex;flex-direction:column;font-size:calc(100cqw/27.75);line-height:1.4;color:var(--ink)}
  .sc{font-family:var(--ui)}
  .sc.prem{
    --page:#0B0B0D; --white:#1B1818; --card:#242424; --line:#2E2E33;
    --ink:#F5F2EC; --ink2:#A7A5A5; --ink3:#6F6D70;
    --teal:#9B8AFF; --pos:#7FB38F; --neg:#D08585; --gold:#D6B878;
    --on-bg:#462CF4; --on-fg:#FFFFFF;
    --nw-grad:linear-gradient(135deg,#2B1E8C 0%,#462CF4 100%); --nw-sub:#CFC7FF;
    --ava:linear-gradient(135deg,#D6B878,#8C6E3C);
    --row-now:#26214A; --bar:#3A3A40; --msg-me:#2B2560; --grab:#3A3A40;
    --acc-bg:rgba(155,138,255,.16); --lock-bg:rgba(214,184,120,.14); --lock-fg:#D6B878;
    --neg-bg:rgba(168,92,92,.2); --pos-bg:rgba(92,138,106,.22);
    --sav-bg:rgba(214,184,120,.09); --sav-bd:rgba(214,184,120,.24); --sav-fg:#D6B878;
    --veil:rgba(11,11,13,.92); --veil0:rgba(11,11,13,.2);
    --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .sc.prem .tab button.on{color:var(--teal)}
  .sc.prem .ph-edge{box-shadow:none}
  .sc.dark{background:#0B0B0D;color:#F5F2EC}
  .isl{position:absolute;top:.75em;left:50%;transform:translateX(-50%);width:7.875em;height:2.31em;background:#0D0C0B;border-radius:999px;z-index:30}
  .st{height:3.875em;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 1.8em;font-size:.8125em;font-weight:800;position:relative;z-index:2}
  .bat{display:inline-block;width:1.55em;height:.78em;border:.09em solid currentColor;border-radius:.24em;position:relative;opacity:.8;vertical-align:-.05em;margin-left:.3em}
  .bat::after{content:"";position:absolute;inset:.1em;right:.4em;background:currentColor;border-radius:.08em}
  .top{flex:0 0 auto;display:flex;align-items:center;gap:.6em;padding:.1em 1em .35em;min-height:2.8em}
  .back{width:2.3em;height:2.3em;border-radius:50%;border:0;background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex:0 0 auto;box-shadow:0 0 0 1px var(--line) inset;font:inherit}
  .dark .back{background:#1B1818;color:#F5F2EC;box-shadow:none}
  .ttl{font-family:var(--serif);font-size:1.75em;font-weight:600;line-height:1.02}
  .bd{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:.2em 1em 1.1em;display:flex;flex-direction:column;gap:.72em;scrollbar-width:none;overscroll-behavior:contain}
  .bd::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--white);border-top:1px solid var(--line);padding:.5em .2em .2em}
  .tab button{font:inherit;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.18em;font-size:.6em;font-weight:700;color:var(--ink3);padding:.2em 0}
  .tab button svg{width:2.1em;height:2.1em}
  .tab button.on{color:var(--ink)}
  .tab button .lk{font-size:.75em;color:var(--gold)}
  .home{flex:0 0 auto;height:2.1em;background:var(--white);display:flex;justify-content:center;align-items:center}
  .home i{width:8.75em;height:.31em;border-radius:999px;background:var(--ink);opacity:.3;display:block}
  .dark .home,.dark .tab{background:#0B0B0D;border-color:#1B1818}.dark .home i{background:#F5F2EC}

  /* елементи */
  .row{display:flex;justify-content:space-between;align-items:center;gap:.5em}
  .rowb{display:flex;justify-content:space-between;align-items:baseline;gap:.5em}
  .w{background:var(--white);border:1px solid var(--line);border-radius:1.3em;padding:1em;display:flex;flex-direction:column;gap:.45em}
  .w.tint{background:var(--card);border-color:transparent}
  .w.nw{background:var(--nw-grad);border:0;color:#fff}
  .w.nw .wl{color:var(--nw-sub)}
  .w.click{cursor:pointer;transition:transform .12s}
  .w.click:active{transform:scale(.985)}
  .wl{font-size:.72em;font-weight:700;color:var(--ink2)}
  .big{font-size:2.05em;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
  .mid{font-size:1.12em;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .sm{font-size:.74em}.xs{font-size:.65em}
  .mut{color:var(--ink3)}.pos{color:var(--pos)}.neg{color:var(--neg)}
  .b{font-weight:800}
  .hello{font-size:.8em;color:var(--ink2)}
  .name{font-family:var(--serif);font-size:1.7em;font-weight:600;line-height:1.02}
  .ava{width:2.6em;height:2.6em;border-radius:50%;background:var(--ava);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.95em;border:0;cursor:pointer;font-family:inherit}
  .cur{font:inherit;font-size:.7em;font-weight:800;padding:.35em .75em;border-radius:999px;border:1px solid var(--line);background:var(--page);cursor:pointer;color:var(--ink)}
  .k3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}
  .k3 .w{padding:.75em;gap:.15em}.k3 .mid{font-size:.98em}
  .k2{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
  .k2 .w{padding:.8em;gap:.15em}
  .trk{height:.55em;border-radius:999px;background:var(--line);overflow:hidden}
  .trk i{display:block;height:100%;border-radius:999px;background:var(--teal);transition:width .35s ease}
  .seg{display:grid;grid-auto-flow:column;gap:.25em;background:var(--card);border-radius:999px;padding:.22em}
  .seg button{font:inherit;font-size:.72em;font-weight:700;border:0;border-radius:999px;padding:.55em .4em;background:transparent;color:var(--ink2);cursor:pointer}
  .seg button.on{background:var(--on-bg);color:var(--on-fg)}
  .li{display:grid;grid-template-columns:2.35em 1fr auto;gap:.15em .7em;align-items:center;padding:.55em 0;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:0}
  .li .n{font-weight:700;font-size:.84em}
  .li .s{font-size:.66em;color:var(--ink3)}
  .li .v{font-weight:800;font-size:.84em;text-align:right;font-variant-numeric:tabular-nums}
  .ic{width:2.35em;height:2.35em;border-radius:.8em;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ic svg{width:1.25em;height:1.25em}
  .src{display:inline-block;font-size:.85em;font-weight:800;padding:.05em .45em;border-radius:999px;background:var(--acc-bg);color:var(--teal);margin-left:.2em}
  .src.m{background:var(--card);color:var(--ink2)}
  .h3{font-family:var(--serif);font-size:1.3em;font-weight:600;line-height:1.1}
  .link{font-size:.68em;color:var(--ink3);font-weight:700;cursor:pointer;background:none;border:0;font-family:inherit}
  .btn{font:inherit;font-size:.86em;font-weight:800;border:0;border-radius:1em;padding:.9em;text-align:center;cursor:pointer;background:var(--on-bg);color:var(--on-fg);width:100%}
  .btn.q{background:var(--card);color:var(--ink)}
  .btn.gold{background:linear-gradient(180deg,#E2C98E,#D6B878 45%,#B99A5E);color:#1B1510}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .fab{position:absolute;right:1.1em;bottom:6.1em;width:3.5em;height:3.5em;border-radius:50%;background:var(--on-bg);color:var(--on-fg);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:8;box-shadow:0 .5em 1.2em -.4em rgba(0,0,0,.45)}
  .fab svg{width:1.5em;height:1.5em}
  .chips{display:flex;flex-wrap:wrap;gap:.35em}
  .chip{font:inherit;font-size:.7em;font-weight:700;padding:.45em .85em;border-radius:999px;border:1px solid var(--line);background:var(--white);color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.35em}
  .chip.on{background:var(--on-bg);color:var(--on-fg);border-color:var(--on-bg)}
  .lock{display:inline-flex;align-items:center;gap:.3em;font-size:.6em;font-weight:800;letter-spacing:.06em;color:var(--lock-fg);background:var(--lock-bg);padding:.25em .6em;border-radius:999px;text-transform:uppercase}
  .lock svg{width:1em;height:1em}
  .locked{position:relative;overflow:hidden}
  .locked .blur{filter:blur(.28em);opacity:.55;pointer-events:none;user-select:none}
  .locked .veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;text-align:center;padding:1em;background:linear-gradient(180deg,var(--veil0),var(--veil) 60%)}
  .bl{display:grid;grid-template-columns:2.35em 1fr;gap:.7em;align-items:center;padding:.5em 0;border-bottom:1px solid var(--line);cursor:pointer}
  .bl:last-child{border-bottom:0}
  .bl .top2{display:flex;justify-content:space-between;align-items:baseline;gap:.4em}
  .bl .n{font-weight:700;font-size:.84em}
  .bl .p{font-weight:800;font-size:.74em;font-variant-numeric:tabular-nums}
  .bl .s{font-size:.66em;color:var(--ink3);font-variant-numeric:tabular-nums}
  .goal{display:grid;grid-template-columns:4.3em 1fr;gap:.8em;align-items:center;padding:.6em;background:var(--white);border:1px solid var(--line);border-radius:1.15em;cursor:pointer}
  .goal .img{height:3.5em;border-radius:.8em}
  .auto{display:inline-flex;gap:.3em;align-items:center;font-size:.6em;font-weight:800;color:var(--teal);background:var(--acc-bg);padding:.2em .6em;border-radius:999px;align-self:flex-start}
  .mi{display:grid;grid-template-columns:2.35em 1fr auto;gap:.7em;align-items:center;padding:.62em 0;border-bottom:1px solid var(--line);cursor:pointer}
  .mi:last-child{border-bottom:0}
  .mi .n{font-weight:700;font-size:.86em}
  .mi .s{font-size:.66em;color:var(--ink3)}
  .chev{color:var(--ink3);width:1em;height:1em}
  table.pf{border-collapse:collapse;width:100%;font-size:.68em;font-variant-numeric:tabular-nums}
  table.pf th,table.pf td{padding:.5em .3em;text-align:right;border-bottom:1px solid var(--line)}
  table.pf th:first-child,table.pf td:first-child{text-align:left}
  table.pf th{font-size:.9em;color:var(--ink3);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
  table.pf tr.now td{background:var(--row-now);font-weight:800}
  table.pf tr.fut td{color:var(--ink3)}
  .bars{display:flex;align-items:flex-end;gap:.5em;height:6em;padding-top:.4em}
  .bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.25em;height:100%}
  .bars b{display:block;width:100%;border-radius:.3em .3em 0 0;background:var(--bar);transition:height .35s}
  .bars b.now{background:var(--teal)}
  .bars small{font-size:.55em;color:var(--ink3);font-weight:700}
  .leg{display:grid;grid-template-columns:.8em 1fr auto auto;gap:.2em .6em;align-items:center;font-size:.7em}
  .leg i{width:.8em;height:.8em;border-radius:.22em;display:block}
  .leg .p{color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
  .leg .v{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
  .bank{display:grid;grid-template-columns:2.4em 1fr auto;gap:.7em;align-items:center;padding:.6em 0;border-bottom:1px solid var(--line);cursor:pointer}
  .bank:last-child{border-bottom:0}
  .bank .lg{width:2.4em;height:2.4em;border-radius:.7em;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.72em}
  .ok{font-size:.66em;font-weight:800;color:var(--pos)}
  .spin{width:1.1em;height:1.1em;border-radius:50%;border:.15em solid var(--line);border-top-color:var(--teal);animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .msg{max-width:86%;padding:.7em .9em;border-radius:1.1em;font-size:.76em;line-height:1.45}
  .msg.me{align-self:flex-end;background:var(--msg-me);border-bottom-right-radius:.3em}
  .msg.ai{align-self:flex-start;background:var(--white);border:1px solid var(--line);border-bottom-left-radius:.3em}
  .msg.ai ul{margin:.3em 0 0;padding-left:1.1em}
  .toggle{display:grid;grid-template-columns:1fr auto;gap:.6em;align-items:center;padding:.6em 0;border-bottom:1px solid var(--line)}
  .toggle:last-child{border-bottom:0}
  .sw{width:2.7em;height:1.55em;border-radius:999px;background:var(--line);position:relative;border:0;cursor:pointer;flex:0 0 auto}
  .sw::after{content:"";position:absolute;top:.17em;left:.17em;width:1.2em;height:1.2em;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
  .sw[aria-checked="true"]{background:var(--teal)}
  .sw[aria-checked="true"]::after{transform:translateX(1.15em)}
  .note{font-size:.64em;color:var(--ink3);line-height:1.45}

  /* нижня шторка й повідомлення */
  .scrim{position:absolute;inset:0;background:rgba(24,20,16,.38);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--page);border-radius:1.6em 1.6em 0 0;padding:.7em 1em 2.3em;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:.7em}
  .sheet.show{transform:none}
  .grab{width:2.6em;height:.28em;border-radius:999px;background:var(--grab);margin:0 auto .2em}
  .fld{display:flex;flex-direction:column;gap:.3em}
  .fld label{font-size:.68em;font-weight:800;color:var(--ink2)}
  .fld input,.fld select{font:inherit;font-size:.9em;padding:.75em .9em;border-radius:.9em;border:1px solid var(--line);background:var(--white);color:var(--ink);width:100%}
  .amt{font-size:2.2em!important;font-weight:800;text-align:center;padding:.3em!important;letter-spacing:-.02em}
  .err{font-size:.66em;color:var(--neg);font-weight:700;min-height:1em}
  .toast{position:absolute;left:1em;right:1em;top:4.2em;z-index:40;background:var(--on-bg);color:var(--on-fg);border-radius:1em;padding:.75em .95em;font-size:.74em;font-weight:700;line-height:1.4;transform:translateY(-140%);opacity:0;transition:transform .3s,opacity .3s;pointer-events:none}
  .toast.show{transform:none;opacity:1}
  .toast.gold{background:#1B1818;color:#D6B878;box-shadow:0 0 0 1px rgba(214,184,120,.35)}

  /* онбординг і Premium */

    return h+'<div class="w nw"><span class="wl">Чистий капітал</span><span class="big" style="color:#fff">'+money(netWorth())+'</span><span class="xs" style="color:var(--nw-sub)">активи '+money(assetsTotal())+' − борги '+money(liabsTotal())+'</span></div>'
      +'<span class="sm mut">Це ваша точка відліку. Далі застосунок покаже, як вона змінюється щомісяця.</span>'
      +'<button class="btn" data-act="enter">Створити акаунт — безкоштовно</button><p class="fine">FREE назавжди, без картки · Демо: реєстрацію імітовано</p></div>';
  }

  /* ── рендер ── */
  var sc=document.getElementById("sc"), top=document.getElementById("top"), bd=document.getElementById("bd"), tab=document.getElementById("tab"), fabwrap=document.getElementById("fabwrap");
  function render(){
    var s=S.screen;
    sc.classList.toggle("dark", s==="paywall");
    var full = s==="onb" || s==="qz";
    sc.classList.toggle("prem", !!S.premium && !full && s!=="paywall");
    var darkNow = s==="paywall" || (!!S.premium && !full);
    document.documentElement.classList.toggle("is-prem", darkNow);
    var tc=document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute("content", darkNow?"#0B0B0D":"#FCF7F0");
    if(full){
      top.innerHTML=""; top.style.display="none"; tab.style.display="none"; fabwrap.innerHTML="";
      bd.style.padding="0"; bd.innerHTML = s==="onb" ? renderOnb() : renderQuiz(); syncModes(); return;
    }
    top.style.display="flex"; bd.style.padding="";
    var isTab=TABS.some(function(t){return t[0]===s;});
    if(s==="paywall"){
      top.innerHTML='<button class="back" data-act="back" aria-label="Назад">'+ic("back",2)+'</button>';
      tab.style.display="none"; fabwrap.innerHTML=""; bd.innerHTML=renderPaywall(); syncModes(); return;
    }
    tab.style.display="grid";
    top.innerHTML = (s==="home") ? '' : (isTab?'':'<button class="back" data-act="back" aria-label="Назад">'+ic("back",2)+'</button>')+'<span class="ttl">'+(TITLES[s]||"")+'</span>';
    top.style.display = s==="home" ? "none" : "flex";
    if(s==="home") bd.style.paddingTop="0";
    bd.innerHTML=(V[s]||V.home)();
    var cur = isTab ? s : (S.stack.length? (function(){for(var i=S.stack.length-1;i>=0;i--){if(TABS.some(function(t){return t[0]===S.stack[i].s;})) return S.stack[i].s;} return "more";})() : "more");
    tab.innerHTML=TABS.map(function(t){
      var lk=(t[0]==="budget"||t[0]==="goals")&&!S.premium;
      return '<button class="'+(cur===t[0]?"on":"")+'" data-go="'+t[0]+'" data-tab="1" aria-label="'+t[1]+'">'+ic(t[2],1.6)+'<span>'+t[1]+(lk?' <span class="lk">●</span>':'')+'</span></button>';
    }).join("");
    fabwrap.innerHTML = (s==="home"||s==="ops") ? '<button class="fab" data-act="add" aria-label="Нова операція">'+ic("plus",2.2)+'</button>' : '';
    var qi=document.getElementById("q");
    if(qi){ qi.addEventListener("input",function(){ V._q=qi.value; var pos=qi.selectionStart; render(); var n=document.getElementById("q"); if(n){n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){}} }); }
    syncModes();
  }

  /* ── шторка ── */
  var sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim");
  function openSheet(html){ sheet.innerHTML='<div class="grab"></div>'+html; sheet.classList.add("show"); scrim.classList.add("show"); var f=sheet.querySelector("input,button"); if(f) setTimeout(function(){f.focus();},280); }
  function closeSheet(){ sheet.classList.remove("show"); scrim.classList.remove("show"); }
  scrim.addEventListener("click",closeSheet);

  var draft;
  function addSheet(){
    draft=draft||{type:"out",c:"yi",a:"mono"};
    var cats = draft.type==="in" ? ["dh"] : CAT_ORDER;
    if(draft.type==="in") draft.c="dh"; else if(draft.c==="dh") draft.c="yi";
    openSheet('<div class="row"><span class="h3">Нова операція</span><button class="link" data-act="close">Закрити</button></div>'
      +'<div class="seg"><button class="'+(draft.type==="out"?"on":"")+'" data-act="dtype" data-v="out">Витрата</button><button class="'+(draft.type==="in"?"on":"")+'" data-act="dtype" data-v="in">Дохід</button></div>'
      +'<div class="fld"><label for="fAmt">Сума, $</label><input id="fAmt" class="amt" inputmode="decimal" placeholder="0" value="'+esc(draft.amt||"")+'"></div>'
      +'<div class="fld"><label for="fTitle">Назва</label><input id="fTitle" type="text" placeholder="'+(draft.type==="in"?"Наприклад, оплата клієнта":"Наприклад, кава")+'" value="'+esc(draft.t||"")+'"></div>'
      +'<div class="fld"><label>Категорія</label><div class="chips">'+cats.map(function(c){return '<button class="chip '+(draft.c===c?"on":"")+'" data-act="dcat" data-v="'+c+'">'+CATS[c].n+'</button>';}).join("")+'</div></div>'
      +'<div class="fld"><label for="fAcc">Рахунок</label><select id="fAcc">'+S.accounts.map(function(a){return '<option value="'+a.id+'" '+(draft.a===a.id?"selected":"")+'>'+esc(a.n)+' · '+money(a.bal)+'</option>';}).join("")+'</select></div>'
      +'<div class="err" id="fErr"></div><button class="btn" data-act="saveop">Зберегти</button>');
  }
  function readDraft(){ var a=document.getElementById("fAmt"),t=document.getElementById("fTitle"),s=document.getElementById("fAcc"); if(a)draft.amt=a.value; if(t)draft.t=t.value; if(s)draft.a=s.value; }

  function limitSheet(c){
    var cat=CATS[c];
    openSheet('<div class="row"><span class="h3">'+cat.n+'</span><button class="link" data-act="close">Закрити</button></div>'
      +'<div class="w tint"><span class="xs mut">Витрачено у вересні</span><span class="mid">'+money(spentBy(c))+'</span></div>'
      +'<div class="w"><span class="wl">Місячний ліміт</span><div class="row"><button class="btn q" style="width:3.2em" data-act="lim" data-c="'+c+'" data-d="-5000" aria-label="Менше на 50">−50</button><span class="big" id="limv">'+money(S.limits[c])+'</span><button class="btn q" style="width:3.2em" data-act="lim" data-c="'+c+'" data-d="5000" aria-label="Більше на 50">+50</button></div><span class="xs mut" id="limp">'+pct(spentBy(c),S.limits[c])+'% використано · план витрат вересня: '+money(limitTotal())+'</span></div>'
      +'<button class="btn" data-act="close">Готово</button>');
  }

  /* ── розкриття тарифу: тема міняється рівно тоді, коли екран закритий шторкою ── */
  var reveal=document.getElementById("reveal"), rvT;
  var reduce=false; try{ reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  function switchTier(on, after){
    if(reduce){ S.premium=on; if(after) after(); render(); save(); return; }
    clearTimeout(rvT);
    reveal.classList.remove("go"); reveal.classList.toggle("light", !on); void reveal.offsetWidth; reveal.classList.add("go");
    rvT=setTimeout(function(){ S.premium=on; if(after) after(); render(); save(); }, 740);
    setTimeout(function(){ reveal.classList.remove("go"); }, 1950);
  }

  /* ── повідомлення ── */
  var tt; function toast(m,gold){ var t=document.getElementById("toast"); t.innerHTML=m; t.classList.toggle("gold",!!gold); t.classList.add("show"); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove("show");},2600); }

  /* ── дії ── */
  function nextId(){ S.seq=(S.seq||100)+1; return "u"+S.seq; }
  function parseAmt(s){ s=String(s||"").replace(/\s/g,"").replace(",","."); if(!/^\d+(\.\d{1,2})?$/.test(s)) return null; var p=s.split("."); var c=parseInt(p[0],10)*100+(p[1]?parseInt((p[1]+"0").slice(0,2),10):0); return c>0?c:null; }

  document.addEventListener("click",function(e){
    var el=e.target.closest("[data-go],[data-act]"); if(!el) return;
    if(!sc.contains(el) && !el.closest(".side")) return;
    var g=el.getAttribute("data-go");
    if(g){
      var p=el.getAttribute("data-p");
      if(g==="qz") V._qs=0;
      if(el.getAttribute("data-tab")) { V._q=""; go(g,p,{tab:true}); }
      else go(g,p);
      return;
    }
    var a=el.getAttribute("data-act");
    switch(a){
      case "back": back(); break;
      case "close": closeSheet(); render(); break;
      case "cur": S.cur = S.cur==="USD"?"UAH":"USD"; render(); save(); toast(S.cur==="UAH"?"Показано в гривні · курс-приклад 41,50 ₴ за $1":"Показано в доларах"); break;
      case "filter": param=el.getAttribute("data-v"); render(); save(); break;
      case "toast": toast(el.getAttribute("data-m")); break;
      case "add": draft=null; addSheet(); break;
      case "dtype": readDraft(); draft.type=el.getAttribute("data-v"); addSheet(); break;
      case "dcat": readDraft(); draft.c=el.getAttribute("data-v"); addSheet(); break;
      case "saveop":
        readDraft();
        var c=parseAmt(draft.amt), err=document.getElementById("fErr");
        if(c===null){ err.textContent="Вкажіть суму більше нуля, наприклад 12 або 12,50."; document.getElementById("fAmt").focus(); return; }
        var title=(draft.t||"").trim()||CATS[draft.c].n;
        var v=draft.type==="in"?c:-c;
        var acc=S.accounts.filter(function(x){return x.id===draft.a;})[0];
        S.ops.push({id:nextId(),t:title,c:draft.c,a:draft.a,v:v,d:MONTH+"-26",src:"m"});
        acc.bal+=v;
        closeSheet(); render(); save();
        if(draft.type==="out"){
          var p2=pct(spentBy(draft.c),S.limits[draft.c]);
          toast("Збережено · баланс "+money(balance())+(S.premium?" · «"+CATS[draft.c].n+"» "+p2+"% ліміту · капітал "+money(netWorth()):" · витрати місяця "+money(expense())));
        } else toast("Збережено · баланс "+money(balance())+" · дохід місяця "+money(income()));
        break;
      case "limit": limitSheet(el.getAttribute("data-c")); break;
      case "lim":
        var cc=el.getAttribute("data-c"), dd=+el.getAttribute("data-d");
        S.limits[cc]=Math.max(0,S.limits[cc]+dd); save();
        document.getElementById("limv").textContent=money(S.limits[cc]);
        document.getElementById("limp").textContent=pct(spentBy(cc),S.limits[cc])+"% використано · план витрат вересня: "+money(limitTotal());
        break;
      case "gm":
        var gg=S.goals.filter(function(x){return x.id===param;})[0]; gg.monthly=Math.max(0,gg.monthly+(+el.getAttribute("data-d"))); render(); save(); break;
      case "topup":
        var g2=S.goals.filter(function(x){return x.id===param;})[0];
        if(g2.monthly<=0){toast("Спершу задайте внесок більше нуля");break;}
        g2.have=Math.min(g2.target,g2.have+g2.monthly); render(); save();
        toast(g2.have>=g2.target?"Ціль досягнуто!":"Поповнено · "+pct(g2.have,g2.target)+"%"); break;
      case "at": V._at=el.getAttribute("data-v"); render(); break;
      case "addacc":
        if(!S.premium && S.accounts.length>=FREE_ACC_LIMIT){ go("paywall"); toast("У FREE — до "+FREE_ACC_LIMIT+" рахунків. Більше — у Premium",true); }
        else { S.accounts.push({id:nextId(),n:"Новий рахунок "+(S.accounts.length+1),k:"вручну",bal:0}); render(); save(); toast("Рахунок додано"); }
        break;
      case "ask":
        var k=el.getAttribute("data-k"), q=el.textContent;
        S.chat.push({w:"me",h:esc(q)}); S.chat.push({w:"ai",h:aiAnswer(k)}); render(); save();
        setTimeout(function(){bd.scrollTop=bd.scrollHeight;},30); break;
      case "bank":
        var b=el.getAttribute("data-b");
        if(S.banks[b]===true){ toast("Уже підключено · операції оновлюються автоматично"); break; }
        if(S.banks[b]==="busy") break;
        S.banks[b]="busy"; render();
        setTimeout(function(){
          var accId = b==="wise"?"wise":(b==="mono"?"mono":null);
          if(!accId){ var nid=nextId(); S.accounts.push({id:nid,n:b==="privat"?"ПриватБанк":"Revolut",k:"з банку",bal:250000}); accId=nid; }
          var imp=[["Сільпо","yi",-4200],["Uklon","tr",-1800],["Аптека","in",-2600]];
          imp.forEach(function(x){ S.ops.push({id:nextId(),t:x[0],c:x[1],a:accId,v:x[2],d:MONTH+"-26",src:"b"}); S.accounts.filter(function(y){return y.id===accId;})[0].bal+=x[2]; });
          S.banks[b]=true; if(S.screen==="banks") render(); save();
          toast("Підключено · імпортовано 3 операції · бюджет і аналітика оновились");
        },1300);
        break;
      case "ckt": var kk=el.getAttribute("data-k"); V._ck[kk]=!V._ck[kk]; render(); break;
      case "ckd": V._ck.days=+el.getAttribute("data-v"); render(); break;
      case "sendck":
        var ck=V._ck, names={goals:"Цілі",budget:"Бюджет",plan:"Фінплан на рік",ops:"Окремі операції й суми"};
        S.checkup={what:Object.keys(names).filter(function(x){return ck[x];}).map(function(x){return names[x];}),until:ck.days===7?"3 жовтня 2026":ck.days===14?"10 жовтня 2026":"26 жовтня 2026"};
        render(); save(); toast("Заявку надіслано експерту"); break;
      case "cancelck": S.checkup=null; V._ck=null; render(); save(); toast("Доступ відкликано"); break;
      case "trial":
        switchTier(true,function(){
          if(S.after){ S.screen=S.after.s; param=S.after.p; S.after=null; }
          else { var prev=S.stack.pop(); S.screen = prev&&prev.s!=="paywall" ? prev.s : "home"; param=prev?prev.p:null; }
          setTimeout(function(){ toast("Premium увімкнено · 7 днів безкоштовно",true); },900);
        }); break;
      case "trialx":
        if(S.premium){ S.expert=true; var pv=S.stack.pop(); S.screen = pv&&pv.s!=="paywall" ? pv.s : "home"; param=pv?pv.p:null; render(); save(); toast("Тариф «Premium + Експерт» увімкнено",true); break; }
        switchTier(true,function(){ S.expert=true; var pv2=S.stack.pop(); S.screen = pv2&&pv2.s!=="paywall" ? pv2.s : "home"; param=pv2?pv2.p:null; setTimeout(function(){ toast("«Premium + Експерт» · 7 днів безкоштовно",true); },900); }); break;
      case "qstart": V._qs=0; S.stack=[]; S.screen="qz"; render(); save(); bd.scrollTop=0; break;
      case "qnext": V._qs=Math.min(3,(V._qs||0)+1); render(); bd.scrollTop=0; break;
      case "qback": if((V._qs||0)===0){ S.screen="onb"; render(); save(); } else { V._qs--; render(); } bd.scrollTop=0; break;
      case "dpay": var li=S.liabs[+el.getAttribute("data-i")]; li.pay=Math.max(0,(li.pay||0)+(+el.getAttribute("data-d"))); render(); save(); break;
      case "cancelprem": switchTier(false,function(){ S.expert=false; S.stack=[]; S.screen="home"; setTimeout(function(){ toast("Повернулись на FREE · записи на місці"); },900); }); break;
      case "logout": S.stack=[]; S.screen="onb"; render(); save(); break;
      case "enter": S.stack=[]; S.screen="home"; render(); save(); break;
      case "resetdemo": S=seed(); V._q=""; V._at="a"; V._ck=null; param=null; try{localStorage.removeItem(STORE);}catch(e){} render(); toast("Усе повернуто до прикладу"); break;
      case "seen": try{localStorage.setItem("mm-seen","1");}catch(e){} closeSheet(); break;
    }
  });

  function syncModes(){}
  document.addEventListener("input",function(e){
    var t=e.target, k=t.getAttribute&&t.getAttribute("data-qk"); if(!k) return;
    var i=+t.getAttribute("data-qi"), v=parseInt(String(t.value).replace(/\D/g,""),10); v=isNaN(v)?0:v*100;
    if(k==="acc") S.accounts[i].bal=v; else if(k==="as") S.assets[i].v=v; else if(k==="li") S.liabs[i].v=v;
    save();
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&sheet.classList.contains("show")){closeSheet();} });

  load(); S.screen="onb"; S.stack=[]; param=null; render(); /* продажний екран — щоразу до входу (рішення власника) */
  
})();
</script>


</body>
